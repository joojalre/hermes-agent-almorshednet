name: PR21 Patch 4 runtime source snapshot

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Export current and PR19 runtime sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: add5fd31c051844130a9881551bf3407b3828659
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      REPORT_DIR: /tmp/pr21-patch4-snapshot-v2
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and export exact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/current/tui_gateway" \
            "$REPORT_DIR/current/tests/tui_gateway" \
            "$REPORT_DIR/current/gateway"
          mkdir -p "$REPORT_DIR/pr19/tui_gateway" \
            "$REPORT_DIR/pr19/tests/tui_gateway" \
            "$REPORT_DIR/pr19/gateway"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          cp tui_gateway/hosted_room_driver.py \
            "$REPORT_DIR/current/tui_gateway/hosted_room_driver.py"
          cp tests/tui_gateway/test_hosted_room_driver_runtime.py \
            "$REPORT_DIR/current/tests/tui_gateway/test_hosted_room_driver_runtime.py"
          cp gateway/hosted_room_driver.py \
            "$REPORT_DIR/current/gateway/hosted_room_driver.py"
          git show "$SOURCE_FINAL:tui_gateway/hosted_room_driver.py" \
            > "$REPORT_DIR/pr19/tui_gateway/hosted_room_driver.py"
          git show "$SOURCE_FINAL:tests/tui_gateway/test_hosted_room_driver_runtime.py" \
            > "$REPORT_DIR/pr19/tests/tui_gateway/test_hosted_room_driver_runtime.py"
          git show "$SOURCE_FINAL:gateway/hosted_room_driver.py" \
            > "$REPORT_DIR/pr19/gateway/hosted_room_driver.py"
          find "$REPORT_DIR" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$REPORT_DIR/sha256.txt"

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-snapshot-v2
          path: /tmp/pr21-patch4-snapshot-v2/**
          if-no-files-found: error
          retention-days: 14
