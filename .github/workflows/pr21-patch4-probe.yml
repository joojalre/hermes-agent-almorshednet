name: PR21 Patch 4 final compatibility probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Verify final runtime stop and liveness hybrid
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 7ce6835b69cf8a07db111126696e29a1a1b4ec67
      REPORT_DIR: /tmp/pr21-patch4-probe-v7
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Build final compatible hybrid in runner only
        shell: bash
        run: |
          set -euo pipefail
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          python .github/scripts/pr21_patch4_probe.py | tee "$REPORT_DIR/apply.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/full-candidate-runtime.py"
          python .github/scripts/pr21_patch4_hybrid.py \
            --baseline "$REPORT_DIR/current-runtime.py" \
            --candidate tui_gateway/hosted_room_driver.py \
            --output tui_gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/hybrid-summary.json" \
            | tee "$REPORT_DIR/hybrid-build.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/hybrid-runtime.py"
          git diff -- tui_gateway/hosted_room_driver.py \
            > "$REPORT_DIR/hybrid.patch"
          git diff --stat | tee "$REPORT_DIR/hybrid-stat.txt"
          python -m py_compile tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Prove test runner has no retry plugin
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest --help > "$REPORT_DIR/pytest-help.txt"
          if grep -F -- "--file-retries" "$REPORT_DIR/pytest-help.txt"; then
            echo "unexpected file retry plugin is active" >&2
            exit 1
          fi
          echo "single_execution_no_retry_plugin=true" \
            | tee "$REPORT_DIR/retry-policy.txt"

      - name: Run exact Patch 4 target suite once
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            | tee "$REPORT_DIR/target-suite.log"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tui_gateway/hosted_room_driver.py \
            | tee "$REPORT_DIR/ruff-check.log"
          python -m compileall -q tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-probe-v7
          path: /tmp/pr21-patch4-probe-v7/**
          if-no-files-found: warn
          retention-days: 14
