name: PR21 Patch 4 runtime candidate probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe runtime stop and liveness candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 7272d34c8cae75e33ca64fa471f27443dbeffcbc
      REPORT_DIR: /tmp/pr21-patch4-probe
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Apply candidate in runner only
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch4_probe.py | tee "$REPORT_DIR/apply.txt"
          python -m py_compile tui_gateway/hosted_room_driver.py
          git diff --check
          git diff --stat | tee "$REPORT_DIR/candidate-stat.txt"

      - name: Run exact Patch 4 target suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short --file-retries 0 \
            | tee "$REPORT_DIR/target-suite.log"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tui_gateway/hosted_room_driver.py \
            | tee "$REPORT_DIR/ruff-check.log"
          python -m compileall -q tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-probe
          path: /tmp/pr21-patch4-probe/**
          if-no-files-found: warn
          retention-days: 14
