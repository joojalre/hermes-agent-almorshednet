name: PR21 Patch 4 selective state and service compatibility probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Prove RED state dependency, then GREEN selective contracts
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 20090bfc9f471665fe64b74abd4904af618e2ed2
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      REPORT_DIR: /tmp/pr21-patch4-probe-v13
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""

    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point and PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Capture unmodified baseline for residual failures
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_stop_room_snapshots_tasks_before_status_transitions \
            tests/tui_gateway/test_hosted_room_service.py::test_create_send_drive_publish_and_replay_without_client_transport \
            tests/tui_gateway/test_hosted_room_service.py::test_terminal_publication_recovers_legacy_member_prefix_at_normal_limit \
            tests/tui_gateway/test_hosted_room_service.py::test_peer_approval_is_scoped_visible_and_resolvable \
            tests/tui_gateway/test_hosted_room_service.py::test_local_room_approval_uses_the_exact_hidden_session \
            tests/tui_gateway/test_hosted_room_service.py::test_stale_local_approval_cannot_resolve_replacement_request \
            tests/gateway/test_hosted_room_gateway_lifecycle.py::test_gateway_restart_resumes_queued_room_for_multiplexed_profile \
            tests/tui_gateway/test_groups_replication_methods.py::test_demote_fences_local_room_against_newer_epoch \
            -q --tb=short > "$REPORT_DIR/baseline-selected.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/baseline-selected.exit"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-probe-v13")
          lines = (report / "baseline-selected.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted({
              line[len("FAILED "):].split(" - ", 1)[0]
              for line in lines
              if line.startswith("FAILED ")
          })
          payload = {"count": len(failures), "failures": failures}
          (report / "baseline-selected-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Build Runtime and Service candidate without State patch
        shell: bash
        run: |
          set -euo pipefail
          cp gateway/hosted_room_driver.py "$REPORT_DIR/current-state.py"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/current-service.py"

          python .github/scripts/pr21_patch4_probe.py \
            | tee "$REPORT_DIR/full-runtime-build.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/full-runtime.py"
          python .github/scripts/pr21_patch4_hybrid_v2.py \
            --baseline "$REPORT_DIR/current-runtime.py" \
            --candidate tui_gateway/hosted_room_driver.py \
            --output tui_gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/runtime-hybrid-summary.json" \
            | tee "$REPORT_DIR/runtime-hybrid-build.txt"

          python .github/scripts/pr21_patch4_service.py \
            --output tui_gateway/hosted_room_service.py \
            --report "$REPORT_DIR/service-summary.json" \
            | tee "$REPORT_DIR/service-build.txt"

          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/runtime-hybrid.py"
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/service-candidate.py"
          python -m py_compile \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py
          git diff --check

      - name: Verify RED is the missing selective State contract
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_create_send_drive_publish_and_replay_without_client_transport \
            -q --tb=short > "$REPORT_DIR/red-missing-state.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/red-missing-state.exit"
          test "$rc" -ne 0
          grep -F "reconcile_stop_fenced_inactive_tasks" \
            "$REPORT_DIR/red-missing-state.log"
          echo "red_reason=missing_reconcile_stop_fenced_inactive_tasks" \
            | tee "$REPORT_DIR/red-proof.txt"

      - name: Verify Service uuid dependency is GREEN before State patch
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_groups_replication_methods.py::test_demote_fences_local_room_against_newer_epoch \
            -q --tb=short \
            | tee "$REPORT_DIR/uuid-green.log"

      - name: Apply only the required Patch4 State contracts
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch4_state.py \
            --output gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/state-summary.json" \
            | tee "$REPORT_DIR/state-build.txt"
          cp gateway/hosted_room_driver.py "$REPORT_DIR/state-candidate.py"
          python -m py_compile gateway/hosted_room_driver.py
          git diff --check

      - name: Verify selective State provenance and current contracts
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_FINAL}:gateway/hosted_room_driver.py" \
            > "$REPORT_DIR/pr19-state.py"
          python - <<'PY' | tee "$REPORT_DIR/state-provenance.txt"
          from pathlib import Path
          import ast

          report = Path("/tmp/pr21-patch4-probe-v13")
          current = (report / "current-state.py").read_text(encoding="utf-8")
          source = (report / "pr19-state.py").read_text(encoding="utf-8")
          candidate = (report / "state-candidate.py").read_text(encoding="utf-8")

          def function_dump(text: str, name: str) -> str:
              matches = [
                  node
                  for node in ast.parse(text).body
                  if isinstance(node, ast.FunctionDef) and node.name == name
              ]
              if len(matches) != 1:
                  raise AssertionError(
                      f"{name}: expected one function, found {len(matches)}"
                  )
              return ast.dump(matches[0], include_attributes=False)

          for name in (
              "_stop_fenced_inactive_rows",
              "reconcile_stop_fenced_inactive_tasks",
          ):
              assert function_dump(candidate, name) == function_dump(source, name)
              print(f"{name}=pr19")

          for name in (
              "requeue_not_admitted_task",
              "resolve_indeterminate_cancellation",
              "complete_task_cancel",
          ):
              assert function_dump(candidate, name) == function_dump(current, name)
              print(f"{name}=current")

          tree = ast.parse(candidate)
          assigned = {
              target.id
              for node in tree.body
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name)
          }
          assert {"OwnerProcessState", "OwnerLiveness"} <= assigned
          print("owner_liveness_aliases=present")
          PY

      - name: Run focused GREEN State and Service contracts
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_create_send_drive_publish_and_replay_without_client_transport \
            tests/tui_gateway/test_hosted_room_service.py::test_demote_waits_for_exact_turn_stop_ack_before_authority_transfer \
            tests/gateway/test_hosted_room_gateway_lifecycle.py::test_gateway_restart_resumes_queued_room_for_multiplexed_profile \
            tests/gateway/test_hosted_room_gateway_lifecycle.py::test_dashboard_and_gateway_workers_share_one_fenced_execution_owner \
            tests/tui_gateway/test_groups_methods.py::test_create_list_send_and_log_roundtrip \
            tests/tui_gateway/test_groups_methods.py::test_send_does_not_trust_client_supplied_actor_identity \
            tests/tui_gateway/test_groups_replication_methods.py::test_demote_fences_local_room_against_newer_epoch \
            -q --tb=short > "$REPORT_DIR/focused-green.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/focused-green.exit"

      - name: Verify Runtime race, peer Stop, and full suite
        shell: bash
        run: |
          set +e
          : > "$REPORT_DIR/runtime-regression.log"
          rc=0
          for attempt in $(seq 1 10); do
            echo "race_attempt=$attempt" \
              | tee -a "$REPORT_DIR/runtime-regression.log"
            uv run python -m pytest \
              tests/tui_gateway/test_hosted_room_driver_runtime.py::test_completion_wins_stop_race_after_attempt_lease_expires \
              -q --tb=short \
              >> "$REPORT_DIR/runtime-regression.log" 2>&1 || rc=$?
          done
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            >> "$REPORT_DIR/runtime-regression.log" 2>&1 || rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/runtime-regression.exit"

      - name: Capture full Service result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short > "$REPORT_DIR/service.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/service.exit"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-probe-v13")
          lines = (report / "service.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted({
              line[len("FAILED "):].split(" - ", 1)[0]
              for line in lines
              if line.startswith("FAILED ")
          })
          payload = {"count": len(failures), "failures": failures}
          (report / "service-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Capture full hosted-room integration result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_gateway_lifecycle.py \
            tests/gateway/test_hosted_room_worker_shutdown.py \
            tests/gateway/test_hosted_room_discussion.py \
            tests/tui_gateway/test_hosted_room_prompt_fence.py \
            tests/tui_gateway/test_hosted_room_server_rpc.py \
            tests/tui_gateway/test_groups_methods.py \
            tests/tui_gateway/test_groups_replication_methods.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short > "$REPORT_DIR/integration.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/integration.exit"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-probe-v13")
          lines = (report / "integration.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted({
              line[len("FAILED "):].split(" - ", 1)[0]
              for line in lines
              if line.startswith("FAILED ")
          })
          payload = {"count": len(failures), "failures": failures}
          (report / "integration-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Capture candidate patch and static verification
        if: always()
        shell: bash
        run: |
          set +e
          git diff -- \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            > "$REPORT_DIR/candidate.patch"
          git diff --stat | tee "$REPORT_DIR/candidate-stat.txt"
          uv run ruff check \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            .github/scripts/pr21_patch4_service.py \
            .github/scripts/pr21_patch4_state.py \
            > "$REPORT_DIR/ruff-check.log" 2>&1
          rc=$?
          python -m compileall -q \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            .github/scripts/pr21_patch4_service.py \
            .github/scripts/pr21_patch4_state.py || rc=$?
          git diff --check || rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/static.exit"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-selective-state-service-probe-v13
          path: /tmp/pr21-patch4-probe-v13/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce required Patch4 gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$REPORT_DIR/focused-green.exit")" = "0"
          test "$(cat "$REPORT_DIR/runtime-regression.exit")" = "0"
          test "$(cat "$REPORT_DIR/static.exit")" = "0"
