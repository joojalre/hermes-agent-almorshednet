name: PR21 Patch 4 peer-safe admission-fenced runtime and service probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Stress completion race, peer Stop, and service integration
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 12768cad9ea3d6e298a6af65ac3677791b1f24e1
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      REPORT_DIR: /tmp/pr21-patch4-probe-v12
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point and PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Build peer-safe Runtime hybrid with Patch4 admission fences
        shell: bash
        run: |
          set -euo pipefail
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          python .github/scripts/pr21_patch4_probe.py \
            | tee "$REPORT_DIR/full-runtime-build.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/full-runtime.py"
          python .github/scripts/pr21_patch4_hybrid_v2.py \
            --baseline "$REPORT_DIR/current-runtime.py" \
            --candidate tui_gateway/hosted_room_driver.py \
            --output tui_gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/runtime-hybrid-summary.json" \
            | tee "$REPORT_DIR/runtime-hybrid-build.txt"
          sha256sum tui_gateway/hosted_room_driver.py \
            | tee "$REPORT_DIR/runtime-hybrid-sha256.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/runtime-hybrid.py"
          python -m py_compile tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Verify hybrid method provenance and peer Stop contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$REPORT_DIR/runtime-method-provenance.txt"
          from pathlib import Path
          import ast

          report = Path("/tmp/pr21-patch4-probe-v12")
          sources = {
              "current": (report / "current-runtime.py").read_text(encoding="utf-8"),
              "patch4": (report / "full-runtime.py").read_text(encoding="utf-8"),
              "hybrid": (report / "runtime-hybrid.py").read_text(encoding="utf-8"),
          }

          def method_node(source: str, name: str) -> ast.FunctionDef:
              tree = ast.parse(source)
              matches = [
                  node
                  for node in ast.walk(tree)
                  if isinstance(node, ast.FunctionDef) and node.name == name
              ]
              if len(matches) != 1:
                  raise AssertionError(f"{name}: expected one method, found {len(matches)}")
              return matches[0]

          def method_dump(source: str, name: str) -> str:
              return ast.dump(method_node(source, name), include_attributes=False)

          assert method_dump(sources["hybrid"], "cancel") == method_dump(
              sources["patch4"], "cancel"
          )
          print("cancel=patch4")
          assert method_dump(sources["hybrid"], "_process_room") == method_dump(
              sources["current"], "_process_room"
          )
          print("_process_room=current")

          hybrid = sources["hybrid"]
          required = (
              "_register_process_submission(submission_key)",
              "_register_process_admission(",
              "_unregister_process_admission(submission_key)",
              "if not bool(getattr(exc, \"retryable\", False)):",
              "elif self._interrupt_stopping_task(binding, stopping):",
              "Exact peer terminal status is already the durable Stop",
              "self._complete_acknowledged_stop(binding, task, lease)",
          )
          for marker in required:
              assert marker in hybrid, marker
              print(f"marker={marker}")

          retry_node = method_node(hybrid, "_retry_stopping_tasks")
          retry_source = ast.get_source_segment(hybrid, retry_node)
          assert retry_source is not None
          peer_start = retry_source.index(
              "if self._peer_stop_acknowledged(binding, task):"
          )
          peer_end = retry_source.index("continue", peer_start) + len("continue")
          peer_branch = retry_source[peer_start:peer_end]
          assert "_settle_stopping_completion" not in peer_branch
          assert "_complete_acknowledged_stop" in peer_branch
          print("peer_terminal_branch=no_history_reharvest")
          PY

      - name: Stress exact completion versus Stop race before Service changes
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT_DIR/race-runtime-only.log"
          for attempt in $(seq 1 25); do
            echo "attempt=$attempt" | tee -a "$REPORT_DIR/race-runtime-only.log"
            uv run python -m pytest \
              tests/tui_gateway/test_hosted_room_driver_runtime.py::test_completion_wins_stop_race_after_attempt_lease_expires \
              -q --tb=short \
              | tee -a "$REPORT_DIR/race-runtime-only.log"
          done

      - name: Verify exact peer terminal Stop contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py::test_peer_terminal_status_acknowledges_durable_stop_on_retry \
            tests/tui_gateway/test_hosted_room_driver_runtime.py::test_peer_terminal_status_must_match_exact_task_attempt \
            -q --tb=short \
            | tee "$REPORT_DIR/peer-stop-contracts.log"

      - name: Build selective Service lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/current-service.py"
          python .github/scripts/pr21_patch4_service.py \
            --output tui_gateway/hosted_room_service.py \
            --report "$REPORT_DIR/service-summary.json" \
            | tee "$REPORT_DIR/service-build.txt"
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/service-candidate.py"
          git diff -- \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            > "$REPORT_DIR/candidate.patch"
          git diff --stat | tee "$REPORT_DIR/candidate-stat.txt"
          python -m py_compile \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py
          git diff --check

      - name: Stress exact completion versus Stop race after Service changes
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT_DIR/race-with-service.log"
          for attempt in $(seq 1 25); do
            echo "attempt=$attempt" | tee -a "$REPORT_DIR/race-with-service.log"
            uv run python -m pytest \
              tests/tui_gateway/test_hosted_room_driver_runtime.py::test_completion_wins_stop_race_after_attempt_lease_expires \
              -q --tb=short \
              | tee -a "$REPORT_DIR/race-with-service.log"
          done

      - name: GREEN exact Runtime suite after Service candidate
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            | tee "$REPORT_DIR/runtime.log"

      - name: Capture Service suite result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short > "$REPORT_DIR/service.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/service.exit"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-probe-v12")
          lines = (report / "service.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted(
              {
                  line[len("FAILED "):].split(" - ", 1)[0]
                  for line in lines
                  if line.startswith("FAILED ")
              }
          )
          payload = {"count": len(failures), "failures": failures}
          (report / "service-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Capture remaining integration result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_gateway_lifecycle.py \
            tests/gateway/test_hosted_room_worker_shutdown.py \
            tests/gateway/test_hosted_room_discussion.py \
            tests/tui_gateway/test_hosted_room_prompt_fence.py \
            tests/tui_gateway/test_hosted_room_server_rpc.py \
            tests/tui_gateway/test_groups_methods.py \
            tests/tui_gateway/test_groups_replication_methods.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short > "$REPORT_DIR/integration.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/integration.exit"

      - name: Static verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            | tee "$REPORT_DIR/ruff-check.log"
          python -m compileall -q \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py
          git diff --check

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-peer-safe-probe-v12
          path: /tmp/pr21-patch4-probe-v12/**
          if-no-files-found: warn
          retention-days: 14
