name: PR21 Patch 4 reachable Stop and peer terminal compatibility probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Prove reachable exact Stop and inactive peer terminal harvest
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: a38afe4943341f1c8a7bfff804d31afedc216b2c
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      REPORT_DIR: /tmp/pr21-patch4-probe-v14
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""

    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point and PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Capture unmodified baseline for the two compatibility targets
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_demote_waits_for_exact_turn_stop_ack_before_authority_transfer \
            tests/tui_gateway/test_hosted_room_service.py::test_headless_room_publishes_peer_member_reply_without_desktop_transport \
            -q --tb=short > "$REPORT_DIR/baseline-targets.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/baseline-targets.exit"

      - name: Build selective Runtime, State, and Service candidate
        shell: bash
        run: |
          set -euo pipefail
          cp gateway/hosted_room_driver.py "$REPORT_DIR/current-state.py"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/current-service.py"

          python .github/scripts/pr21_patch4_probe.py \
            | tee "$REPORT_DIR/full-runtime-build.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/full-runtime.py"
          python .github/scripts/pr21_patch4_hybrid_v2.py \
            --baseline "$REPORT_DIR/current-runtime.py" \
            --candidate tui_gateway/hosted_room_driver.py \
            --output tui_gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/runtime-hybrid-summary.json" \
            | tee "$REPORT_DIR/runtime-hybrid-build.txt"

          python .github/scripts/pr21_patch4_state.py \
            --output gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/state-summary.json" \
            | tee "$REPORT_DIR/state-build.txt"

          python .github/scripts/pr21_patch4_service.py \
            --output tui_gateway/hosted_room_service.py \
            --report "$REPORT_DIR/service-summary.json" \
            | tee "$REPORT_DIR/service-build.txt"

          cp gateway/hosted_room_driver.py "$REPORT_DIR/state-candidate.py"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/runtime-hybrid.py"
          cp tui_gateway/hosted_room_service.py "$REPORT_DIR/service-candidate.py"
          python -m py_compile \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py
          git diff --check

      - name: Verify exact compatibility markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$REPORT_DIR/compatibility-markers.txt"
          from pathlib import Path

          runtime = Path(
              "/tmp/pr21-patch4-probe-v14/runtime-hybrid.py"
          ).read_text(encoding="utf-8")
          markers = (
              "foreign_owner_may_be_live = (",
              "return not foreign_owner_may_be_live",
          )
          for marker in markers:
              assert marker in runtime, marker
              print(f"runtime_marker={marker}")
          assert "transport.history(" in runtime
          assert "if receipt is not None:" in runtime
          print("runtime_marker=inactive_peer_history_harvest")
          PY

      - name: Run GREEN exact Stop and peer terminal targets
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_acknowledged_stop_refuses_to_disband_while_exact_turn_is_still_running \
            tests/tui_gateway/test_hosted_room_service.py::test_demote_waits_for_exact_turn_stop_ack_before_authority_transfer \
            tests/tui_gateway/test_hosted_room_service.py::test_headless_room_publishes_peer_member_reply_without_desktop_transport \
            -q --tb=short > "$REPORT_DIR/compatibility-targets.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/compatibility-targets.exit"

      - name: Verify Runtime race, peer Stop, and full suite
        shell: bash
        run: |
          set +e
          : > "$REPORT_DIR/runtime-regression.log"
          rc=0
          for attempt in $(seq 1 10); do
            echo "race_attempt=$attempt" \
              | tee -a "$REPORT_DIR/runtime-regression.log"
            uv run python -m pytest \
              tests/tui_gateway/test_hosted_room_driver_runtime.py::test_completion_wins_stop_race_after_attempt_lease_expires \
              -q --tb=short \
              >> "$REPORT_DIR/runtime-regression.log" 2>&1 || rc=$?
          done
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            >> "$REPORT_DIR/runtime-regression.log" 2>&1 || rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/runtime-regression.exit"

      - name: Capture full Service result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short > "$REPORT_DIR/service.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/service.exit"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-probe-v14")
          lines = (report / "service.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted({
              line[len("FAILED "):].split(" - ", 1)[0]
              for line in lines
              if line.startswith("FAILED ")
          })
          payload = {"count": len(failures), "failures": failures}
          (report / "service-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Capture full hosted-room integration result
        if: always()
        shell: bash
        run: |
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_gateway_lifecycle.py \
            tests/gateway/test_hosted_room_worker_shutdown.py \
            tests/gateway/test_hosted_room_discussion.py \
            tests/tui_gateway/test_hosted_room_prompt_fence.py \
            tests/tui_gateway/test_hosted_room_server_rpc.py \
            tests/tui_gateway/test_groups_methods.py \
            tests/tui_gateway/test_groups_replication_methods.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short > "$REPORT_DIR/integration.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/integration.exit"

      - name: Capture candidate patch and static verification
        if: always()
        shell: bash
        run: |
          set +e
          git diff -- \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            > "$REPORT_DIR/candidate.patch"
          git diff --stat | tee "$REPORT_DIR/candidate-stat.txt"
          uv run ruff check \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            .github/scripts/pr21_patch4_service.py \
            .github/scripts/pr21_patch4_state.py \
            > "$REPORT_DIR/ruff-check.log" 2>&1
          rc=$?
          python -m compileall -q \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            .github/scripts/pr21_patch4_service.py \
            .github/scripts/pr21_patch4_state.py || rc=$?
          git diff --check || rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/static.exit"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-reachable-stop-peer-terminal-probe-v14
          path: /tmp/pr21-patch4-probe-v14/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce required Patch4 gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$REPORT_DIR/compatibility-targets.exit")" = "0"
          test "$(cat "$REPORT_DIR/runtime-regression.exit")" = "0"
          test "$(cat "$REPORT_DIR/integration.exit")" = "0"
          test "$(cat "$REPORT_DIR/static.exit")" = "0"
