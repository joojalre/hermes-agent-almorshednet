name: PR21 Patch 4 runtime candidate AST probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch4-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Inspect exact runtime candidate delta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 0a6b0b728c5e25846f819f9f8e6a8cf21be19759
      REPORT_DIR: /tmp/pr21-patch4-probe-v4
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable probe point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Apply candidate and record exact AST delta
        shell: bash
        run: |
          set -euo pipefail
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          python .github/scripts/pr21_patch4_probe.py | tee "$REPORT_DIR/apply.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/candidate-runtime.py"
          git diff -- tui_gateway/hosted_room_driver.py \
            > "$REPORT_DIR/candidate.patch"
          git diff --stat | tee "$REPORT_DIR/candidate-stat.txt"
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import json
          from pathlib import Path

          report_dir = Path("/tmp/pr21-patch4-probe-v4")
          before = (report_dir / "current-runtime.py").read_text(encoding="utf-8")
          after = (report_dir / "candidate-runtime.py").read_text(encoding="utf-8")

          def digest(node: ast.AST) -> str:
              rendered = ast.dump(node, include_attributes=False)
              return hashlib.sha256(rendered.encode("utf-8")).hexdigest()

          def inventory(text: str) -> dict[str, object]:
              tree = ast.parse(text)
              functions: dict[str, str] = {}
              classes: dict[str, dict[str, str]] = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      functions[node.name] = digest(node)
                  elif isinstance(node, ast.ClassDef):
                      methods: dict[str, str] = {}
                      for child in node.body:
                          if isinstance(
                              child, (ast.FunctionDef, ast.AsyncFunctionDef)
                          ):
                              methods[child.name] = digest(child)
                      classes[node.name] = methods
              return {"functions": functions, "classes": classes}

          left = inventory(before)
          right = inventory(after)
          changed_functions = sorted(
              name
              for name in set(left["functions"]) | set(right["functions"])
              if left["functions"].get(name) != right["functions"].get(name)
          )
          changed_methods: dict[str, list[str]] = {}
          for class_name in sorted(
              set(left["classes"]) | set(right["classes"])
          ):
              left_methods = left["classes"].get(class_name, {})
              right_methods = right["classes"].get(class_name, {})
              changed = sorted(
                  name
                  for name in set(left_methods) | set(right_methods)
                  if left_methods.get(name) != right_methods.get(name)
              )
              if changed:
                  changed_methods[class_name] = changed

          payload = {
              "changed_top_level_functions": changed_functions,
              "changed_class_methods": changed_methods,
              "before_sha256": hashlib.sha256(before.encode("utf-8")).hexdigest(),
              "after_sha256": hashlib.sha256(after.encode("utf-8")).hexdigest(),
          }
          (report_dir / "ast-diff.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          markdown = [
              "# Patch 4 candidate AST delta",
              "",
              "## Top-level functions",
              "",
              *[f"- `{name}`" for name in changed_functions],
              "",
              "## Class methods",
              "",
          ]
          for class_name, names in changed_methods.items():
              markdown.append(f"### `{class_name}`")
              markdown.extend(f"- `{name}`" for name in names)
              markdown.append("")
          (report_dir / "ast-diff.md").write_text(
              "\n".join(markdown).rstrip() + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          python -m py_compile tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Run exact Patch 4 target suite once
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            | tee "$REPORT_DIR/target-suite.log"

      - name: Static verification
        if: always()
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check tui_gateway/hosted_room_driver.py \
            | tee "$REPORT_DIR/ruff-check.log"
          python -m compileall -q tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-probe-v4
          path: /tmp/pr21-patch4-probe-v4/**
          if-no-files-found: warn
          retention-days: 14
