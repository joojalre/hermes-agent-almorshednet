name: PR21 Patch 2 driver admission TDD apply

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch2-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch2-driver-writer
  cancel-in-progress: false

jobs:
  apply:
    name: RED GREEN driver schema and atomic admission
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: bd8dbd95e92721c9c0e58f1f99cbc5f968474df2
      REPORT_DIR: /tmp/pr21-patch2-driver
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting point and PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor 778d5d79d513317938a5df6fb31a58baca370960 HEAD
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "20d0a6a42365b2b2351e1dca819022b6ec477b39"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Include task column order in selective schema port
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/pr21_patch2_apply.py")
          text = path.read_text(encoding="utf-8")
          old = '    "_TASK_COLUMNS",\n'
          new = '    "_TASK_COLUMNS",\n    "_TASK_COLUMN_ORDER",\n'
          if text.count(old) != 1:
              raise SystemExit("expected one _TASK_COLUMNS selector")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile .github/scripts/pr21_patch2_apply.py

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11 and locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Add focused regressions without production changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch2_apply.py \
            write-tests --report-dir "$REPORT_DIR"
          uv run ruff format tests/gateway/test_hosted_room_driver_admission.py
          python -m py_compile \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver_admission.py
          git diff -- gateway/hosted_room_driver.py > "$REPORT_DIR/pre-red-driver.diff"
          test ! -s "$REPORT_DIR/pre-red-driver.diff"

      - name: RED atomic Stop admission fence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver_admission.py::test_task_admission_is_atomically_fenced_by_latest_stop \
            -q --tb=short > "$REPORT_DIR/red-barrier.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-barrier.exit"
          test "$rc" = "1"
          grep -F "TaskAdmissionBlockedError" "$REPORT_DIR/red-barrier.log"

      - name: RED owner identity schema migration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver_admission.py::test_pre_owner_identity_schema_is_migrated_without_losing_work \
            -q --tb=short > "$REPORT_DIR/red-owner-schema.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-owner-schema.exit"
          test "$rc" = "1"
          grep -F "process_pid" "$REPORT_DIR/red-owner-schema.log"

      - name: Apply selective driver schema and admission nodes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch2_apply.py \
            apply --report-dir "$REPORT_DIR"
          python -m py_compile gateway/hosted_room_driver.py
          git diff --check
          python - <<'PY'
          import inspect
          from gateway import hosted_room_driver as driver

          required = (
              "block_room_admissions",
              "begin_room_demotion",
              "pending_room_demotion",
              "requeue_not_admitted_task",
              "resolve_indeterminate_cancellation",
          )
          for name in required:
              if not callable(getattr(driver, name, None)):
                  raise SystemExit(f"required driver API missing: {name}")
          acquire = inspect.signature(driver.acquire_lease)
          for name in ("process_pid", "process_start_time"):
              if name not in acquire.parameters:
                  raise SystemExit(f"lease owner parameter missing: {name}")
          complete = inspect.signature(driver.complete_task_cancel)
          if "lease" in complete.parameters:
              raise SystemExit("candidate complete_task_cancel API was overwritten")
          PY

      - name: GREEN focused schema and admission regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver_admission.py \
            -q --tb=short | tee "$REPORT_DIR/green-focused.log"

      - name: GREEN current driver compatibility suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver.py \
            -q --tb=short | tee "$REPORT_DIR/green-current-driver.log"

      - name: GREEN current hosted-room runtime suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short | tee "$REPORT_DIR/green-runtime.log"

      - name: Verify Patch 1 storage integration remains green
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py \
            -q --tb=short | tee "$REPORT_DIR/green-storage-integration.log"

      - name: Static verification on touched code
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            gateway/hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver_admission.py \
            | tee "$REPORT_DIR/ruff-check.log"
          uv run ruff format --check \
            tests/gateway/test_hosted_room_driver_admission.py \
            | tee "$REPORT_DIR/ruff-format-new-test.log"
          python -m py_compile \
            gateway/hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver_admission.py
          git diff --check

      - name: Remove temporary reconciliation files and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch2_apply.py \
            cleanup --report-dir "$REPORT_DIR"
          git status --short | tee "$REPORT_DIR/final-status.txt"
          git diff --stat | tee "$REPORT_DIR/final-stat.txt"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          temporary = {
              ".github/scripts/pr21_patch2_apply.py",
              ".github/scripts/pr21_patch2_probe.py",
              ".github/workflows/pr21-patch2-apply.yml",
              ".github/workflows/pr21-patch2-probe.yml",
          }
          required = {
              "gateway/hosted_room_driver.py",
              "tests/gateway/test_hosted_room_driver.py",
              "tests/gateway/test_hosted_room_driver_admission.py",
          }
          changed = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = {line[3:] for line in changed if len(line) >= 4}
          unexpected = paths - (temporary | required)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          if not required <= paths:
              raise SystemExit(f"required changes missing: {sorted(required - paths)}")
          for path in temporary:
              if Path(path).exists():
                  raise SystemExit(f"temporary file remains: {path}")
          PY

      - name: Commit and fast-forward PR21 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore atomic driver admission"
          new_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$new_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$new_head"
          {
            echo "workflow_head=$GITHUB_SHA"
            echo "pushed_head=$pushed"
            echo "branch=$TARGET_BRANCH"
          } | tee "$REPORT_DIR/push.txt"

      - name: Upload RED GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-patch2-driver-evidence-v2
          path: /tmp/pr21-patch2-driver/**
          if-no-files-found: warn
          retention-days: 14
