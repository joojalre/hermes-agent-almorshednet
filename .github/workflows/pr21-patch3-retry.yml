name: PR21 Patch 3 replica correctness retry

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch3-retry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch3-replica-writer
  cancel-in-progress: false

jobs:
  apply:
    name: RED GREEN replica correctness and demotion RPC
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: c9762fa3fca4e94954a0d6976161c5100cbb4548
      REPORT_DIR: /tmp/pr21-patch3-replica-v4
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact head and immutable PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Verify replica baseline and write focused tests only
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest tests/gateway/test_hosted_room_replicas.py -q --tb=short \
            | tee "$REPORT_DIR/baseline-replicas.log"
          python .github/scripts/pr21_patch3_apply.py write-tests --report-dir "$REPORT_DIR"
          uv run ruff format tests/gateway/test_hosted_room_replicas_patch3.py
          python -m py_compile tests/gateway/test_hosted_room_replicas_patch3.py
          git diff -- gateway/hosted_room_replicas.py > "$REPORT_DIR/pre-red-production.diff"
          test ! -s "$REPORT_DIR/pre-red-production.diff"

      - name: Prove RED replica cases before production change
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test_promote_refuses_replica_that_has_not_caught_up
            test_promote_preflights_authoritative_event_count
            test_demote_rejects_unpublished_terminal_liability_without_mutation
          )
          for test_name in "${tests[@]}"; do
            set +e
            uv run python -m pytest \
              "tests/gateway/test_hosted_room_replicas_patch3.py::$test_name" \
              -q --tb=short > "$REPORT_DIR/red-$test_name.log" 2>&1
            rc=$?
            set -e
            test "$rc" = "1"
            grep -F "DID NOT RAISE" "$REPORT_DIR/red-$test_name.log"
          done

      - name: Apply selective PR19 replica nodes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch3_apply.py apply --report-dir "$REPORT_DIR"
          python - <<'PY'
          from pathlib import Path

          path = Path("gateway/hosted_room_replicas.py")
          path.write_text(
              path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )
          PY
          python -m py_compile gateway/hosted_room_replicas.py
          git diff --check

      - name: GREEN focused and existing replica suites
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short | tee "$REPORT_DIR/green-focused.log"
          uv run python -m pytest tests/gateway/test_hosted_room_replicas.py \
            -q --tb=short | tee "$REPORT_DIR/green-existing-replicas.log"

      - name: Prove RED groups.demote domain mapping
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_groups_replication_methods.py::test_demote_preserves_domain_validation_errors \
            -q --tb=short > "$REPORT_DIR/red-demote-rpc.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-demote-rpc.exit"
          test "$rc" = "1"
          grep -F "5119" "$REPORT_DIR/red-demote-rpc.log"

      - name: Restore exact PR19 groups.demote contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import os
          import subprocess
          from pathlib import Path

          path = Path("tui_gateway/methods_groups.py")
          current = path.read_text(encoding="utf-8")
          final = subprocess.check_output(
              ["git", "show", f"{os.environ['SOURCE_FINAL']}:{path.as_posix()}"],
              text=True,
          )

          def handler(text: str) -> ast.FunctionDef:
              tree = ast.parse(text)
              matches = []
              for node in tree.body:
                  if not isinstance(node, ast.FunctionDef):
                      continue
                  for decorator in node.decorator_list:
                      if (
                          isinstance(decorator, ast.Call)
                          and isinstance(decorator.func, ast.Name)
                          and decorator.func.id == "method"
                          and decorator.args
                          and isinstance(decorator.args[0], ast.Constant)
                          and decorator.args[0].value == "groups.demote"
                      ):
                          matches.append(node)
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one groups.demote handler, found {len(matches)}"
                  )
              return matches[0]

          def offsets(text: str) -> tuple[list[int], int]:
              values = []
              total = 0
              for line in text.splitlines(keepends=True):
                  values.append(total)
                  total += len(line)
              return values, total

          def span(text: str, node: ast.FunctionDef) -> tuple[int, int]:
              lines = text.splitlines(keepends=True)
              values, total = offsets(text)
              start_line = min(
                  [node.lineno, *(item.lineno for item in node.decorator_list)]
              )
              start = values[start_line - 1]
              end = values[node.end_lineno] if node.end_lineno < len(lines) else total
              return start, end

          current_node = handler(current)
          final_node = handler(final)
          current_start, current_end = span(current, current_node)
          final_start, final_end = span(final, final_node)
          replacement = final[final_start:final_end].rstrip()
          merged = (
              current[:current_start]
              + replacement
              + "\n\n"
              + current[current_end:].lstrip("\n")
          ).rstrip() + "\n"
          ast.parse(merged, filename=str(path))
          merged_node = handler(merged)
          if ast.dump(merged_node, include_attributes=False) != ast.dump(
              final_node, include_attributes=False
          ):
              raise RuntimeError("groups.demote handler differs from final PR19 source")
          path.write_text(merged, encoding="utf-8")
          PY
          python -m py_compile tui_gateway/methods_groups.py
          git diff --check

      - name: GREEN groups replication RPC suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest tests/tui_gateway/test_groups_replication_methods.py \
            -q --tb=short | tee "$REPORT_DIR/green-replication-methods.log"

      - name: Verify storage driver and room integration
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_rooms.py \
            -q --tb=short | tee "$REPORT_DIR/green-storage-driver-rooms.log"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            gateway/hosted_room_replicas.py \
            tui_gateway/methods_groups.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            | tee "$REPORT_DIR/ruff-check.log"
          uv run ruff format --check \
            gateway/hosted_room_replicas.py \
            tui_gateway/methods_groups.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            | tee "$REPORT_DIR/ruff-format.log"
          python -m py_compile \
            gateway/hosted_room_replicas.py \
            tui_gateway/methods_groups.py \
            tests/gateway/test_hosted_room_replicas_patch3.py
          git diff --check

      - name: Remove temporary files and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/pr21_patch3_apply.py \
            .github/workflows/pr21-patch3-apply.yml \
            .github/workflows/pr21-patch3-retry.yml
          git status --short | tee "$REPORT_DIR/final-status.txt"
          git diff --stat | tee "$REPORT_DIR/final-stat.txt"
          git diff --check
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/scripts/pr21_patch3_apply.py",
              ".github/workflows/pr21-patch3-apply.yml",
              ".github/workflows/pr21-patch3-retry.yml",
              "gateway/hosted_room_replicas.py",
              "tui_gateway/methods_groups.py",
              "tests/gateway/test_hosted_room_replicas_patch3.py",
          }
          required = {
              "gateway/hosted_room_replicas.py",
              "tui_gateway/methods_groups.py",
              "tests/gateway/test_hosted_room_replicas_patch3.py",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths - allowed:
              raise SystemExit(f"unexpected changed paths: {sorted(paths - allowed)}")
          if not required <= paths:
              raise SystemExit(f"required changes missing: {sorted(required - paths)}")
          PY

      - name: Commit and fast-forward PR21 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore replica correctness"
          new_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$new_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$new_head"
          printf 'workflow_head=%s\npushed_head=%s\nbranch=%s\n' \
            "$GITHUB_SHA" "$pushed" "$TARGET_BRANCH" | tee "$REPORT_DIR/push.txt"

      - name: Upload RED GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-patch3-replica-evidence-v4
          path: /tmp/pr21-patch3-replica-v4/**
          if-no-files-found: warn
          retention-days: 14
