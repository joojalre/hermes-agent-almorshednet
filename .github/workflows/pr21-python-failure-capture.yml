name: PR21 Python failure capture

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-python-failure-capture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-python-failure-capture-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture Python failure slice ${{ matrix.slice }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Capture slice output
        id: tests
        shell: bash
        env:
          HERMES_TEST_WORKERS: 4
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set +e
          source .venv/bin/activate
          evidence="$RUNNER_TEMP/pr21-python-failure-slice-${{ matrix.slice }}"
          mkdir -p "$evidence"
          scripts/run_tests.sh --slice "${{ matrix.slice }}/4" 2>&1 \
            | tee "$evidence/full.log"
          status=${PIPESTATUS[0]}
          {
            echo "slice=${{ matrix.slice }}/4"
            echo "exit_status=$status"
            echo
            rg -n 'FAILED|ERROR|TIMED OUT|repro:|short test summary|FAILURES' \
              "$evidence/full.log" || true
          } > "$evidence/failure-index.txt"
          tail -n 500 "$evidence/full.log" > "$evidence/tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-python-failure-evidence-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/pr21-python-failure-slice-${{ matrix.slice }}/**
          if-no-files-found: error
          retention-days: 3

      - name: Preserve test conclusion
        if: always()
        shell: bash
        run: test "${{ steps.tests.outputs.status }}" = "0"
