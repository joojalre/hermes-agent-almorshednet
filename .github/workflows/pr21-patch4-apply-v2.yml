name: PR21 Patch 4 apply verified runtime stop liveness v2

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-apply-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch4-final-writer
  cancel-in-progress: false

jobs:
  apply:
    name: Apply, clean, commit, reverify, and fast-forward Patch4 v2
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 5e7dd417f70ea2c6189ee7e7492ea583d410a693
      SOURCE_FINAL: 20d0a6a42365b2b2351e1dca819022b6ec477b39
      MAIN_FINAL: e6c06033a04d9745ed1efea97ce35401323dbfd7
      REPORT_DIR: /tmp/pr21-patch4-apply-final
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable write point and fetch exact source commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin \
            refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin \
            refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_FINAL"
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "$SOURCE_FINAL"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Re-run the exact consolidated proof before applying
        shell: bash
        run: |
          set -euo pipefail
          FINAL_REPORT_DIR="$REPORT_DIR"
          export REPORT_DIR=/tmp/pr21-patch4-probe-v17
          rm -rf "$REPORT_DIR"
          bash .github/scripts/pr21_patch4_probe_v17.sh
          mkdir -p "$FINAL_REPORT_DIR/pre-commit-proof"
          cp -a "$REPORT_DIR/." "$FINAL_REPORT_DIR/pre-commit-proof/"

      - name: Remove all Patch4 reconciliation tooling from the final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch -- \
            .github/scripts/pr21_patch4_compat.py \
            .github/scripts/pr21_patch4_compat_v2.py \
            .github/scripts/pr21_patch4_compat_v3.py \
            .github/scripts/pr21_patch4_compat_v4.py \
            .github/scripts/pr21_patch4_hybrid.py \
            .github/scripts/pr21_patch4_hybrid_v2.py \
            .github/scripts/pr21_patch4_probe.py \
            .github/scripts/pr21_patch4_probe_v17.sh \
            .github/scripts/pr21_patch4_service.py \
            .github/scripts/pr21_patch4_state.py \
            .github/workflows/pr21-patch4-analyze.yml \
            .github/workflows/pr21-patch4-ast.yml \
            .github/workflows/pr21-patch4-final.yml \
            .github/workflows/pr21-patch4-probe.yml \
            .github/workflows/pr21-patch4-probe-v13.yml \
            .github/workflows/pr21-patch4-probe-v15.yml \
            .github/workflows/pr21-patch4-probe-v16.yml \
            .github/workflows/pr21-patch4-probe-v17.yml \
            .github/workflows/pr21-patch4-snapshot.yml \
            .github/workflows/pr21-patch4-apply.yml \
            .github/workflows/pr21-patch4-apply-v2.yml

          if find .github/scripts .github/workflows -maxdepth 1 -type f \
            \( -name 'pr21_patch4_*' -o -name 'pr21-patch4-*' \) \
            -print -quit | grep -q .; then
            echo "Patch4 tooling remains in the final tree" >&2
            find .github/scripts .github/workflows -maxdepth 1 -type f \
              \( -name 'pr21_patch4_*' -o -name 'pr21-patch4-*' \) -print >&2
            exit 1
          fi

      - name: Verify final change scope before commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee "$REPORT_DIR/pre-commit-status.txt"
          git diff --stat | tee "$REPORT_DIR/pre-commit-stat.txt"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          final_files = {
              "gateway/hosted_room_driver.py",
              "tui_gateway/hosted_room_driver.py",
              "tui_gateway/hosted_room_service.py",
              "tests/tui_gateway/test_hosted_room_service.py",
              "tests/gateway/test_hosted_rooms.py",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = {line[3:] for line in status if len(line) >= 4}
          unexpected = {
              path
              for path in paths
              if path not in final_files
              and not path.startswith(".github/scripts/pr21_patch4_")
              and not path.startswith(".github/workflows/pr21-patch4-")
          }
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          missing = final_files - paths
          if missing:
              raise SystemExit(f"expected final changes missing: {sorted(missing)}")
          for path in final_files:
              if not Path(path).exists():
                  raise SystemExit(f"final file missing: {path}")
          PY

      - name: Commit the verified Patch4 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore runtime stop liveness"
          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "workflow_head=$GITHUB_SHA"
            echo "final_head=$final_head"
            echo "final_tree=$final_tree"
          } | tee "$REPORT_DIR/commit.txt"
          test -z "$(git status --porcelain)"
          if git ls-tree -r --name-only HEAD \
            | grep -E '^(\.github/scripts/pr21_patch4_|\.github/workflows/pr21-patch4-)'; then
            echo "Patch4 tooling leaked into committed tree" >&2
            exit 1
          fi

      - name: Reverify the exact committed tree without reconciliation tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/post-commit-proof"
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py::test_stop_room_snapshots_tasks_before_status_transitions \
            tests/tui_gateway/test_hosted_room_service.py::test_demote_waits_for_exact_turn_stop_ack_before_authority_transfer \
            tests/tui_gateway/test_hosted_room_service.py::test_cross_process_pending_approval_requires_exact_generation_and_owner_consumes \
            tests/tui_gateway/test_hosted_room_service.py::test_headless_room_publishes_peer_member_reply_without_desktop_transport \
            tests/tui_gateway/test_hosted_room_service.py::test_peer_approval_is_scoped_visible_and_resolvable \
            tests/tui_gateway/test_hosted_room_service.py::test_local_room_approval_uses_the_exact_hidden_session \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/previous-failures.log"

          : > "$REPORT_DIR/post-commit-proof/race.log"
          for attempt in $(seq 1 30); do
            echo "attempt=$attempt" | tee -a "$REPORT_DIR/post-commit-proof/race.log"
            uv run python -m pytest \
              tests/tui_gateway/test_hosted_room_driver_runtime.py::test_completion_wins_stop_race_after_attempt_lease_expires \
              -q --tb=short | tee -a "$REPORT_DIR/post-commit-proof/race.log"
          done

          : > "$REPORT_DIR/post-commit-proof/replay-page-repeat.log"
          for attempt in $(seq 1 20); do
            echo "attempt=$attempt" | tee -a "$REPORT_DIR/post-commit-proof/replay-page-repeat.log"
            uv run python -m pytest \
              tests/gateway/test_hosted_rooms.py::test_room_log_pages_are_bounded_by_serialized_event_bytes \
              -q --tb=short | tee -a "$REPORT_DIR/post-commit-proof/replay-page-repeat.log"
          done

          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py::test_peer_terminal_status_acknowledges_durable_stop_on_retry \
            tests/tui_gateway/test_hosted_room_driver_runtime.py::test_peer_terminal_status_must_match_exact_task_attempt \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/peer-stop.log"

          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/runtime.log"

          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/service.log"

          uv run python -m pytest \
            tests/gateway/test_hosted_room_gateway_lifecycle.py \
            tests/gateway/test_hosted_room_worker_shutdown.py \
            tests/gateway/test_hosted_room_discussion.py \
            tests/tui_gateway/test_hosted_room_prompt_fence.py \
            tests/tui_gateway/test_hosted_room_server_rpc.py \
            tests/tui_gateway/test_groups_methods.py \
            tests/tui_gateway/test_groups_replication_methods.py \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/integration.log"

          uv run python -m pytest \
            tests/gateway/test_hosted_rooms.py \
            tests/gateway/test_hosted_room_storage_reservations.py \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_driver_admission.py \
            tests/gateway/test_hosted_room_replicas.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short | tee "$REPORT_DIR/post-commit-proof/prior-patches.log"

          uv run ruff check \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            tests/tui_gateway/test_hosted_room_service.py \
            tests/gateway/test_hosted_rooms.py \
            | tee "$REPORT_DIR/post-commit-proof/ruff-check.log"
          python -m compileall -q \
            gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_driver.py \
            tui_gateway/hosted_room_service.py \
            tests/tui_gateway/test_hosted_room_service.py \
            tests/gateway/test_hosted_rooms.py
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Fast-forward the PR21 branch only after exact-commit verification
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$final_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$final_head"
          {
            echo "workflow_head=$GITHUB_SHA"
            echo "pushed_head=$pushed"
            echo "branch=$TARGET_BRANCH"
          } | tee "$REPORT_DIR/push.txt"

      - name: Upload final Patch4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-evidence-final-v2
          path: /tmp/pr21-patch4-apply-final/**
          if-no-files-found: warn
          retention-days: 14
