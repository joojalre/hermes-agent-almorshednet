name: PR21 Patch 1 storage merge probe

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch1-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-patch1-storage-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe PR19 storage delta against v0.21 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: false

      - name: Verify scope and fetch immutable PR19 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ebe6b3c51d65ae1bd604936236da3818b20751bc HEAD
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "20d0a6a42365b2b2351e1dca819022b6ec477b39"
          git cat-file -e c19e98fbf5e0ceb243d066e3e46a4f304fb8d606^{commit}

      - name: Probe three-way storage merge
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/pr21-patch1-storage-probe"
          mkdir -p "$REPORT"

          git show c19e98fbf5e0ceb243d066e3e46a4f304fb8d606:gateway/hosted_rooms.py > "$REPORT/base.py"
          cp gateway/hosted_rooms.py "$REPORT/candidate.py"
          git show 20d0a6a42365b2b2351e1dca819022b6ec477b39:gateway/hosted_rooms.py > "$REPORT/pr19-final.py"

          set +e
          git merge-file --diff3 -p \
            "$REPORT/candidate.py" \
            "$REPORT/base.py" \
            "$REPORT/pr19-final.py" \
            > "$REPORT/merged.py"
          merge_rc=$?
          set -e
          echo "$merge_rc" > "$REPORT/merge-file.exit"
          grep -n '^<<<<<<<\|^|||||||\|^=======\|^>>>>>>>' "$REPORT/merged.py" \
            > "$REPORT/conflict-markers.txt" || true

          git diff --binary \
            c19e98fbf5e0ceb243d066e3e46a4f304fb8d606 \
            20d0a6a42365b2b2351e1dca819022b6ec477b39 \
            -- gateway/hosted_rooms.py > "$REPORT/storage.patch"
          set +e
          git apply --3way --check "$REPORT/storage.patch" \
            > "$REPORT/git-apply-check.log" 2>&1
          apply_rc=$?
          set -e
          echo "$apply_rc" > "$REPORT/git-apply-check.exit"

          python - "$REPORT" <<'PY'
          from pathlib import Path
          import ast
          import json
          import sys

          report = Path(sys.argv[1])
          merged = (report / "merged.py").read_text(encoding="utf-8")
          markers = (report / "conflict-markers.txt").read_text(encoding="utf-8").splitlines()
          parse_ok = False
          parse_error = None
          try:
              ast.parse(merged, filename="merged.py")
              parse_ok = True
          except SyntaxError as exc:
              parse_error = f"{exc.msg} at {exc.lineno}:{exc.offset}"
          summary = {
              "candidate_head": "${{ github.sha }}",
              "candidate_parent_contains": "ebe6b3c51d65ae1bd604936236da3818b20751bc",
              "source_base": "c19e98fbf5e0ceb243d066e3e46a4f304fb8d606",
              "source_final": "20d0a6a42365b2b2351e1dca819022b6ec477b39",
              "merge_file_exit": int((report / "merge-file.exit").read_text().strip()),
              "git_apply_check_exit": int((report / "git-apply-check.exit").read_text().strip()),
              "conflict_marker_count": len(markers),
              "merged_ast_ok": parse_ok,
              "merged_ast_error": parse_error,
          }
          (report / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-patch1-storage-probe
          path: ${{ runner.temp }}/pr21-patch1-storage-probe/**
          if-no-files-found: error
          retention-days: 14
