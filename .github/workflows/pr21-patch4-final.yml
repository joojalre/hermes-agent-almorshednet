name: PR21 Patch 4 runtime stop and liveness final apply

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch4-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch4-runtime-writer
  cancel-in-progress: false

jobs:
  apply:
    name: RED GREEN runtime stop and liveness invariants
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: c79df24992f43200d904e1cd13edacc2b179ff7a
      EXPECTED_BASELINE_SHA256: 79789fe9e725ba3e2bf15440dc1de0ce60b45bb7d137d3c42b86f58eed1839fe
      EXPECTED_HYBRID_SHA256: def9c9cf8f39a4e0447cc5d6fce33b73824d3fc371f0e6e4df9b3392ade10bf6
      REPORT_DIR: /tmp/pr21-patch4-final-v2
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(sha256sum tui_gateway/hosted_room_driver.py | awk '{print $1}')" = "$EXPECTED_BASELINE_SHA256"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Capture untouched hosted-room service baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short > "$REPORT_DIR/baseline-service.log" 2>&1
          baseline_rc=$?
          set -e
          echo "$baseline_rc" | tee "$REPORT_DIR/baseline-service.exit"
          test "$baseline_rc" = "1"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-final-v2")
          lines = (report / "baseline-service.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          failures = sorted(
              {
                  line[len("FAILED "):].split(" - ", 1)[0]
                  for line in lines
                  if line.startswith("FAILED ")
              }
          )
          expected = sorted(
              {
                  "tests/tui_gateway/test_hosted_room_service.py::test_stop_room_snapshots_tasks_before_status_transitions",
                  "tests/tui_gateway/test_hosted_room_service.py::test_demotion_interrupts_inflight_turn_before_authority_changes",
                  "tests/tui_gateway/test_hosted_room_service.py::test_terminal_publication_recovers_legacy_member_prefix_at_normal_limit",
                  "tests/tui_gateway/test_hosted_room_service.py::test_demote_waits_for_exact_turn_stop_ack_before_authority_transfer",
                  "tests/tui_gateway/test_hosted_room_service.py::test_headless_room_publishes_peer_member_reply_without_desktop_transport",
                  "tests/tui_gateway/test_hosted_room_service.py::test_peer_approval_is_scoped_visible_and_resolvable",
                  "tests/tui_gateway/test_hosted_room_service.py::test_local_room_approval_uses_the_exact_hidden_session",
                  "tests/tui_gateway/test_hosted_room_service.py::test_stale_local_approval_cannot_resolve_replacement_request",
              }
          )
          payload = {"failures": failures, "expected": expected}
          (report / "baseline-service-failures.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (report / "baseline-service-failures.txt").write_text(
              "\n".join(failures) + "\n",
              encoding="utf-8",
          )
          if failures != expected:
              raise SystemExit(
                  f"unexpected untouched service baseline: {failures}"
              )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Prove current Runtime suite is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short > "$REPORT_DIR/red-runtime.log" 2>&1
          rc=$?
          set -e
          echo "$rc" | tee "$REPORT_DIR/red-runtime.exit"
          test "$rc" = "1"
          grep -F "test_completion_wins_stop_race_after_attempt_lease_expires" \
            "$REPORT_DIR/red-runtime.log"
          grep -F "test_proven_not_admitted_submission_settles_without_ambiguity" \
            "$REPORT_DIR/red-runtime.log"

      - name: Apply exact verified Patch 4 hybrid
        shell: bash
        run: |
          set -euo pipefail
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/current-runtime.py"
          python .github/scripts/pr21_patch4_probe.py \
            | tee "$REPORT_DIR/full-candidate-build.txt"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/full-candidate-runtime.py"
          python .github/scripts/pr21_patch4_hybrid.py \
            --baseline "$REPORT_DIR/current-runtime.py" \
            --candidate tui_gateway/hosted_room_driver.py \
            --output tui_gateway/hosted_room_driver.py \
            --report "$REPORT_DIR/hybrid-summary.json" \
            | tee "$REPORT_DIR/hybrid-build.txt"
          hybrid_sha="$(sha256sum tui_gateway/hosted_room_driver.py | awk '{print $1}')"
          echo "$hybrid_sha" | tee "$REPORT_DIR/hybrid-sha256.txt"
          test "$hybrid_sha" = "$EXPECTED_HYBRID_SHA256"
          cp tui_gateway/hosted_room_driver.py "$REPORT_DIR/final-runtime.py"
          git diff -- tui_gateway/hosted_room_driver.py \
            > "$REPORT_DIR/final-runtime.patch"
          git diff --stat | tee "$REPORT_DIR/apply-stat.txt"
          python -m py_compile tui_gateway/hosted_room_driver.py
          git diff --check

      - name: GREEN exact Runtime target suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_driver_runtime.py \
            -q --tb=short \
            | tee "$REPORT_DIR/green-runtime.log"

      - name: Prove no new hosted-room service failures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/tui_gateway/test_hosted_room_service.py \
            -q --tb=short > "$REPORT_DIR/candidate-service.log" 2>&1
          candidate_rc=$?
          set -e
          echo "$candidate_rc" | tee "$REPORT_DIR/candidate-service.exit"
          test "$candidate_rc" = "1"
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path("/tmp/pr21-patch4-final-v2")

          def failures(name: str) -> list[str]:
              lines = (report / name).read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()
              return sorted(
                  {
                      line[len("FAILED "):].split(" - ", 1)[0]
                      for line in lines
                      if line.startswith("FAILED ")
                  }
              )

          baseline = failures("baseline-service.log")
          candidate = failures("candidate-service.log")
          payload = {
              "baseline_failures": baseline,
              "candidate_failures": candidate,
              "added_failures": sorted(set(candidate) - set(baseline)),
              "removed_failures": sorted(set(baseline) - set(candidate)),
              "identical": baseline == candidate,
          }
          (report / "service-differential.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          if baseline != candidate:
              raise SystemExit("Patch 4 changed the hosted-room service failure set")
          if len(candidate) != 8:
              raise SystemExit(f"unexpected service failure count: {len(candidate)}")
          PY

      - name: GREEN remaining driver and lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_room_gateway_lifecycle.py \
            tests/gateway/test_hosted_room_worker_shutdown.py \
            tests/gateway/test_hosted_room_discussion.py \
            tests/tui_gateway/test_hosted_room_prompt_fence.py \
            tests/tui_gateway/test_hosted_room_server_rpc.py \
            tests/tui_gateway/test_groups_methods.py \
            tests/tui_gateway/test_groups_replication_methods.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short \
            | tee "$REPORT_DIR/green-integration.log"

      - name: Static verification on touched production code
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tui_gateway/hosted_room_driver.py \
            | tee "$REPORT_DIR/ruff-check.log"
          python -m compileall -q tui_gateway/hosted_room_driver.py
          git diff --check

      - name: Remove temporary Patch 4 reconciliation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/pr21_patch4_probe.py \
            .github/scripts/pr21_patch4_hybrid.py \
            .github/workflows/pr21-patch4-analyze.yml \
            .github/workflows/pr21-patch4-ast.yml \
            .github/workflows/pr21-patch4-probe.yml \
            .github/workflows/pr21-patch4-snapshot.yml \
            .github/workflows/pr21-patch4-final.yml
          git status --short | tee "$REPORT_DIR/final-status.txt"
          git diff --stat | tee "$REPORT_DIR/final-stat.txt"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          temporary = {
              ".github/scripts/pr21_patch4_probe.py",
              ".github/scripts/pr21_patch4_hybrid.py",
              ".github/workflows/pr21-patch4-analyze.yml",
              ".github/workflows/pr21-patch4-ast.yml",
              ".github/workflows/pr21-patch4-probe.yml",
              ".github/workflows/pr21-patch4-snapshot.yml",
              ".github/workflows/pr21-patch4-final.yml",
          }
          expected = temporary | {"tui_gateway/hosted_room_driver.py"}
          rows = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths != expected:
              raise SystemExit(
                  f"unexpected final scope; expected={sorted(expected)} actual={sorted(paths)}"
              )
          for path in temporary:
              if Path(path).exists():
                  raise SystemExit(f"temporary file remains: {path}")
          PY

      - name: Commit and fast-forward PR21 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore runtime stop liveness"
          new_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$new_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$new_head"
          printf 'workflow_head=%s\npushed_head=%s\nbranch=%s\n' \
            "$GITHUB_SHA" "$pushed" "$TARGET_BRANCH" \
            | tee "$REPORT_DIR/push.txt"

      - name: Upload final RED GREEN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr21-patch4-runtime-evidence-final-v2
          path: /tmp/pr21-patch4-final-v2/**
          if-no-files-found: warn
          retention-days: 14
