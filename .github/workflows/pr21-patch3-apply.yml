name: PR21 Patch 3 replica correctness TDD apply

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch3-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch3-replica-writer
  cancel-in-progress: false

jobs:
  apply:
    name: RED GREEN replica promotion and demotion invariants
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 93dbbb25de85a48f15710382ee21b2e9b8352697
      REPORT_DIR: /tmp/pr21-patch3-replica
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting point and PR19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "20d0a6a42365b2b2351e1dca819022b6ec477b39"
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Verify Patch 1 dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from gateway import hosted_rooms as rooms

          required = (
              "MAX_ACTIVE_ROOMS",
              "_CRITICAL_CONTROL_EVENT_KINDS",
              "_assert_event_capacity",
              "_closing_discussion_liability_keys",
              "_correlated_terminal_task_ids",
              "_is_terminal_recovery_plan",
              "_terminal_publication_liabilities",
          )
          for name in required:
              if not hasattr(rooms, name):
                  raise SystemExit(f"required Patch 1 dependency missing: {name}")
          parameters = inspect.signature(rooms._assert_event_capacity).parameters
          for name in (
              "additional_events",
              "allow_control",
              "allow_stop",
              "allow_terminal_recovery",
              "released_task_ids",
              "released_liability_keys",
              "remaining_demotion_control_events",
          ):
              if name not in parameters:
                  raise SystemExit(f"capacity contract parameter missing: {name}")
          PY
          python -m py_compile .github/scripts/pr21_patch3_apply.py

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11 and locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev

      - name: Verify existing replica baseline
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest tests/gateway/test_hosted_room_replicas.py \
            -q --tb=short | tee "$REPORT_DIR/baseline-replicas.log"

      - name: Add focused regressions without production changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch3_apply.py \
            write-tests --report-dir "$REPORT_DIR"
          uv run ruff format tests/gateway/test_hosted_room_replicas_patch3.py
          python -m py_compile tests/gateway/test_hosted_room_replicas_patch3.py
          git diff -- gateway/hosted_room_replicas.py > "$REPORT_DIR/pre-red-production.diff"
          test ! -s "$REPORT_DIR/pre-red-production.diff"

      - name: RED incomplete replica promotion
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_replicas_patch3.py::test_promote_refuses_replica_that_has_not_caught_up \
            -q --tb=short > "$REPORT_DIR/red-incomplete.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-incomplete.exit"
          test "$rc" = "1"
          grep -F "DID NOT RAISE" "$REPORT_DIR/red-incomplete.log"

      - name: RED authoritative event capacity preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_replicas_patch3.py::test_promote_preflights_authoritative_event_count \
            -q --tb=short > "$REPORT_DIR/red-event-capacity.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-event-capacity.exit"
          test "$rc" = "1"
          grep -F "DID NOT RAISE" "$REPORT_DIR/red-event-capacity.log"

      - name: RED unpublished terminal demotion fence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_replicas_patch3.py::test_demote_rejects_unpublished_terminal_liability_without_mutation \
            -q --tb=short > "$REPORT_DIR/red-demotion-liability.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-demotion-liability.exit"
          test "$rc" = "1"
          grep -F "DID NOT RAISE" "$REPORT_DIR/red-demotion-liability.log"

      - name: Apply selective replica correctness nodes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch3_apply.py \
            apply --report-dir "$REPORT_DIR"
          python -m py_compile gateway/hosted_room_replicas.py
          git diff --check
          python - <<'PY'
          from gateway import hosted_room_replicas as replicas

          for name in (
              "ingest_page",
              "promote_replica",
              "validate_demotion_observation",
              "demote_room",
          ):
              if not callable(getattr(replicas, name, None)):
                  raise SystemExit(f"required replica API missing: {name}")
          PY

      - name: GREEN focused replica correctness regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            -q --tb=short | tee "$REPORT_DIR/green-focused.log"

      - name: GREEN existing replica suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest tests/gateway/test_hosted_room_replicas.py \
            -q --tb=short | tee "$REPORT_DIR/green-existing-replicas.log"

      - name: Verify storage driver and hosted-room integration
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py \
            tests/gateway/test_hosted_room_driver.py \
            tests/gateway/test_hosted_rooms.py \
            -q --tb=short | tee "$REPORT_DIR/green-storage-driver-rooms.log"

      - name: Verify gateway replication method compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/tui_gateway/test_groups_replication_methods.py \
            -q --tb=short | tee "$REPORT_DIR/green-replication-methods.log"

      - name: Static verification on touched code
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            gateway/hosted_room_replicas.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            | tee "$REPORT_DIR/ruff-check.log"
          uv run ruff format --check \
            gateway/hosted_room_replicas.py \
            tests/gateway/test_hosted_room_replicas_patch3.py \
            | tee "$REPORT_DIR/ruff-format.log"
          python -m py_compile \
            gateway/hosted_room_replicas.py \
            tests/gateway/test_hosted_room_replicas_patch3.py
          git diff --check

      - name: Remove temporary reconciliation files and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch3_apply.py \
            cleanup --report-dir "$REPORT_DIR"
          git status --short | tee "$REPORT_DIR/final-status.txt"
          git diff --stat | tee "$REPORT_DIR/final-stat.txt"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          temporary = {
              ".github/scripts/pr21_patch3_apply.py",
              ".github/workflows/pr21-patch3-apply.yml",
          }
          required = {
              "gateway/hosted_room_replicas.py",
              "tests/gateway/test_hosted_room_replicas_patch3.py",
          }
          changed = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = {line[3:] for line in changed if len(line) >= 4}
          unexpected = paths - (temporary | required)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          if not required <= paths:
              raise SystemExit(f"required changes missing: {sorted(required - paths)}")
          for path in temporary:
              if Path(path).exists():
                  raise SystemExit(f"temporary file remains: {path}")
          PY

      - name: Commit and fast-forward PR21 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore replica correctness"
          new_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$new_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$new_head"
          {
            echo "workflow_head=$GITHUB_SHA"
            echo "pushed_head=$pushed"
            echo "branch=$TARGET_BRANCH"
          } | tee "$REPORT_DIR/push.txt"

      - name: Upload RED GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-patch3-replica-evidence-v2
          path: /tmp/pr21-patch3-replica/**
          if-no-files-found: warn
          retention-days: 14
