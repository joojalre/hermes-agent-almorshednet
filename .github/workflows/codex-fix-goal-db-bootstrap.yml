name: Codex fix goal DB bootstrap

on:
  push:
    branches:
      - codex/fix-goal-db-bootstrap-20260818

concurrency:
  group: codex-fix-goal-db-bootstrap-20260818
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/fix-goal-db-bootstrap-20260818
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Apply the bounded bootstrap fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("gateway/run.py")
          text = path.read_text(encoding="utf-8")
          old = '''        max_turns = self._goal_max_turns_from_config()
                  return GoalManager(session_id=sid, default_max_turns=max_turns), session_entry
          '''
          new = '''        max_turns = self._goal_max_turns_from_config()
                  manager = await asyncio.to_thread(
                      GoalManager,
                      session_id=sid,
                      default_max_turns=max_turns,
                  )
                  return manager, session_entry
          '''
          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f"expected exactly one goal-manager bootstrap block, found {matches}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Run the focused regression test
        shell: bash
        run: uv run pytest tests/gateway/test_goal_max_turns_config.py -q

      - name: Commit only the verified production fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-goal-db-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway/run.py .github/workflows/codex-fix-goal-db-bootstrap.yml
          git diff --cached --check
          git commit -m "fix(gateway): initialize goal persistence off event loop"
          git push origin HEAD:codex/fix-goal-db-bootstrap-20260818
