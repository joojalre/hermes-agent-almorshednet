name: PR21 Patch 1 storage TDD apply

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-patch1-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr21-patch1-storage-writer
  cancel-in-progress: false

jobs:
  apply:
    name: RED GREEN storage reservations and liabilities
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: codex/sync-hermes-v021-20260901
      EXPECTED_PARENT: 1585816c8e31886d27f700b429eee6ca2c975c66
      REPORT_DIR: ${{ runner.temp }}/pr21-patch1-storage
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR21 branch with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/sync-hermes-v021-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting point and source history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor ebe6b3c51d65ae1bd604936236da3818b20751bc HEAD
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/pull/19/head:refs/remotes/origin/pr19-final
          test "$(git rev-parse refs/remotes/origin/pr19-final)" = "20d0a6a42365b2b2351e1dca819022b6ec477b39"
          git cat-file -e c19e98fbf5e0ceb243d066e3e46a4f304fb8d606^{commit}
          git status --short | tee "$REPORT_DIR/start-status.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        shell: bash
        run: uv python install 3.11

      - name: Install focused test dependencies
        shell: bash
        run: uv sync --locked --python 3.11 --extra dev

      - name: Add focused regressions without production changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch1_apply.py write-tests
          uv run ruff format tests/gateway/test_hosted_room_storage_reservations.py
          git diff -- gateway/hosted_rooms.py > "$REPORT_DIR/pre-red-production.diff"
          test ! -s "$REPORT_DIR/pre-red-production.diff"
          python -m py_compile tests/gateway/test_hosted_room_storage_reservations.py

      - name: RED correlated terminal publication
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py::test_terminal_recovery_plan_accepts_complete_correlation \
            -q --tb=short > "$REPORT_DIR/red-correlation.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-correlation.exit"
          test "$rc" = "1"
          grep -F "history limit" "$REPORT_DIR/red-correlation.log"

      - name: RED durable discussion liability
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py::test_open_admission_reservation_is_durable_across_transactions \
            -q --tb=short > "$REPORT_DIR/red-liability.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT_DIR/red-liability.exit"
          test "$rc" = "1"
          grep -F "require_open_admissions" "$REPORT_DIR/red-liability.log"

      - name: Apply only the final PR19 storage delta
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch1_apply.py \
            apply-production --report-dir "$REPORT_DIR"
          git diff --check
          python -m py_compile gateway/hosted_rooms.py

      - name: GREEN focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_room_storage_reservations.py \
            -q --tb=short | tee "$REPORT_DIR/green-focused.log"

      - name: GREEN complete hosted room storage file
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest \
            tests/gateway/test_hosted_rooms.py \
            tests/gateway/test_hosted_room_storage_reservations.py \
            -q --tb=short | tee "$REPORT_DIR/green-storage.log"

      - name: Static verification on touched code
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            gateway/hosted_rooms.py \
            tests/gateway/test_hosted_room_storage_reservations.py \
            | tee "$REPORT_DIR/ruff-check.log"
          uv run ruff format --check \
            gateway/hosted_rooms.py \
            tests/gateway/test_hosted_room_storage_reservations.py \
            | tee "$REPORT_DIR/ruff-format-check.log"
          python -m py_compile \
            gateway/hosted_rooms.py \
            tests/gateway/test_hosted_room_storage_reservations.py
          git diff --check

      - name: Remove temporary runner files and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr21_patch1_apply.py cleanup
          git status --short | tee "$REPORT_DIR/final-status.txt"
          git diff --stat | tee "$REPORT_DIR/final-stat.txt"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              ".github/scripts/pr21_patch1_apply.py",
              ".github/workflows/pr21-patch1-apply.yml",
              ".github/workflows/pr21-patch1-probe.yml",
              "gateway/hosted_rooms.py",
              "tests/gateway/test_hosted_room_storage_reservations.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
          )
          paths = {line[3:] for line in changed if len(line) >= 4}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          required = {
              "gateway/hosted_rooms.py",
              "tests/gateway/test_hosted_room_storage_reservations.py",
          }
          if not required <= paths:
              raise SystemExit(f"required changes missing: {sorted(required - paths)}")
          for temporary in allowed - required:
              if Path(temporary).exists():
                  raise SystemExit(f"temporary file remains: {temporary}")
          PY

      - name: Commit and fast-forward PR21 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hermes PR21 Reconciler"
          git config user.email "pr21-reconciler@invalid.local"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign --no-verify \
            -m "fix(hosted-rooms): restore storage recovery invariants"
          new_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$new_head"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed" = "$new_head"
          {
            echo "workflow_head=$GITHUB_SHA"
            echo "pushed_head=$pushed"
            echo "branch=$TARGET_BRANCH"
          } | tee "$REPORT_DIR/push.txt"

      - name: Upload RED GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr21-patch1-storage-evidence
          path: ${{ runner.temp }}/pr21-patch1-storage/**
          if-no-files-found: warn
          retention-days: 14
