name: PR21 shadowed hosted-room test guard

on:
  push:
    branches:
      - codex/sync-hermes-v021-20260901
    paths:
      - .github/workflows/pr21-fix-shadowed-hosted-room-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr21-shadowed-hosted-room-test-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify both terminal publication tests remain collected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify unique top-level tests and both reserve scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path

          path = Path("tests/tui_gateway/test_hosted_room_service.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          names = [
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith("test_")
          ]
          duplicates = sorted(name for name, count in Counter(names).items() if count > 1)
          if duplicates:
              raise SystemExit(f"shadowed top-level tests remain: {duplicates}")

          expected = {
              "test_terminal_publication_rejects_whole_plan_without_partial_append_at_history_limit",
              "test_terminal_publication_reserves_the_whole_plan_before_append",
          }
          missing = sorted(expected - set(names))
          if missing:
              raise SystemExit(f"terminal publication coverage missing: {missing}")
          print("verified independent terminal publication coverage")
          PY
          git diff --check
